name: Deploy

# Deploys are deliberate: only a v* tag ships to production.
# workflow_dispatch exists for the first-deploy rehearsal (dry_run defaults
# to true) and to re-run a failed upload without cutting a new tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify only — do NOT upload to one.com"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://magtech.se
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - run: npm run verify

      # Rollback source: download this artifact and re-upload if a deploy
      # goes bad. dist/ is gitignored, so this is the only copy of the
      # exact bytes that shipped.
      - name: Archive built index.html
        uses: actions/upload-artifact@v7
        with:
          name: index-html-${{ github.sha }}
          path: dist/index.html
          retention-days: 90

      - name: Report dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run: build and verification passed. Nothing was uploaded."
          echo "Re-run with dry_run = false, or push a v* tag, to deploy."

      # one.com plans below Enthusiast have no SSH shell, so rsync/scp are
      # unavailable — plain SFTP works on every tier. Host key is pinned via
      # ONECOM_KNOWN_HOSTS rather than blindly trusted.
      - name: Upload to one.com over SFTP
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          SFTP_HOST: ${{ secrets.ONECOM_SFTP_HOST }}
          SFTP_USER: ${{ secrets.ONECOM_SFTP_USERNAME }}
          # sshpass -e reads the password from SSHPASS, keeping it out of the
          # process list and out of shell argument quoting entirely.
          SSHPASS: ${{ secrets.ONECOM_SFTP_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.ONECOM_KNOWN_HOSTS }}
          REMOTE_PATH: ${{ vars.ONECOM_REMOTE_PATH }}
        run: |
          set -euo pipefail
          test -n "$REMOTE_PATH" || { echo "ONECOM_REMOTE_PATH variable is not set"; exit 1; }
          test -n "$SFTP_HOST" || { echo "ONECOM_SFTP_HOST secret is not set"; exit 1; }
          test -n "$SFTP_USER" || { echo "ONECOM_SFTP_USERNAME secret is not set"; exit 1; }
          test -n "$SSHPASS"   || { echo "ONECOM_SFTP_PASSWORD secret is not set"; exit 1; }
          # A pasted secret with surrounding whitespace looks identical in the
          # UI but authenticates as a different string.
          case "$SSHPASS" in
            [[:space:]]*|*[[:space:]]) echo "ERROR: password secret has leading/trailing whitespace"; exit 1 ;;
          esac
          case "$SFTP_USER" in
            [[:space:]]*|*[[:space:]]) echo "ERROR: username secret has leading/trailing whitespace"; exit 1 ;;
          esac
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # Batch commands go in a file rather than on stdin: sshpass needs to
          # drive the tty for the password prompt, and feeding the batch over
          # stdin at the same time is a known source of silent auth failures.
          # -b aborts on the first failed command and exits non-zero.
          # Read the file back after writing it and compare checksums below:
          # this proves the bytes landed at the remote path, independently of
          # any HTTP cache sitting in front of the site.
          printf 'put dist/index.html %s\nget %s %s/roundtrip.html\nbye\n' \
            "$REMOTE_PATH" "$REMOTE_PATH" "$RUNNER_TEMP" > "$RUNNER_TEMP/sftp-batch"
          # -v prints the auth negotiation (never the password, and GitHub
          # masks the secrets regardless), which distinguishes "password was
          # never sent" from "password was sent and rejected".
          # BatchMode=no is load-bearing: sftp -b implies BatchMode=yes, which
          # disables password and keyboard-interactive auth entirely, so ssh
          # never issues the prompt sshpass is waiting to answer. Without it
          # the connection fails as "Permission denied" having never tried.
          sshpass -e sftp -v -b "$RUNNER_TEMP/sftp-batch" \
            -o BatchMode=no \
            -o StrictHostKeyChecking=yes \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -P 22 "$SFTP_USER@$SFTP_HOST"
          # Authoritative check that the deploy landed: what we sent must be
          # byte-identical to what the server now holds at that exact path.
          if ! cmp -s dist/index.html "$RUNNER_TEMP/roundtrip.html"; then
            echo "ERROR: file read back from $REMOTE_PATH does not match what was uploaded"
            echo "  sent:     $(wc -c < dist/index.html) bytes, md5 $(md5sum < dist/index.html)"
            echo "  read back: $(wc -c < "$RUNNER_TEMP/roundtrip.html") bytes, md5 $(md5sum < "$RUNNER_TEMP/roundtrip.html")"
            exit 1
          fi
          echo "Uploaded and verified $REMOTE_PATH ($(wc -c < dist/index.html) bytes)"

      # The upload itself is already proven by the SFTP round-trip above.
      # This step confirms the public site is healthy and reports whether the
      # new bytes are visible yet. one.com fronts the site with Varnish, so a
      # stale response here is a caching artifact, not a failed deploy —
      # serving a broken page is a real failure, so only that fails the job.
      - name: Verify the live site
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
            -H 'Cache-Control: no-cache' https://magtech.se/ -o live.html
          for id in hero sectors services experience about contact; do
            grep -q "id=\"$id\"" live.html || { echo "live site missing #$id"; exit 1; }
          done
          grep -q 'https://formspree.io/f/' live.html || { echo "live site missing form endpoint"; exit 1; }
          echo "Live site is healthy ($(wc -c < live.html) bytes)."
          # Poll for the new content, tolerating cache lag.
          for attempt in 1 2 3 4 5 6; do
            if cmp -s live.html dist/index.html; then
              echo "Live site is serving the newly deployed build."
              exit 0
            fi
            echo "attempt $attempt: live site still serving previous build, waiting for cache..."
            sleep 10
            curl -fsS -H 'Cache-Control: no-cache' "https://magtech.se/?cb=$RANDOM" -o live.html || true
          done
          echo "NOTE: upload verified over SFTP, but the public URL is still serving"
          echo "      the previous build. This is one.com's Varnish cache, which"
          echo "      expires on its own; clear it in the control panel to see the"
          echo "      change immediately."
